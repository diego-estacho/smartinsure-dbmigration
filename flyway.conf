# Configuração versionada do Flyway — somente o que não é secret (ADR-054).
# URL, usuário e senha vêm de variáveis de ambiente: FLYWAY_URL, FLYWAY_USER, FLYWAY_PASSWORD.

flyway.locations=filesystem:migrations

# ADR-042: timestamp puro com outOfOrder desabilitado — migration com timestamp
# anterior à última aplicada é rejeitada (recriar com timestamp novo).
flyway.outOfOrder=false

# Rejeita arquivo .sql fora da convenção de nomenclatura.
flyway.validateMigrationNaming=true
